# Primary application database — PostgreSQL.
# Solid Queue / Cache / Cable keep their own SQLite databases (transient data, zero migration risk).
#
# Required env vars (development/test fall back to sensible defaults):
#   DATABASE_URL             — full postgres URL for production
#   POSTGRES_DB / _USER / _PASSWORD — individual overrides if DATABASE_URL is not set
#
# macOS local dev (Homebrew Postgres): createdb padmakara_find_development && createdb padmakara_find_test

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "padmakara_find_development") %>
    username: <%= ENV.fetch("POSTGRES_USER", "") %>
    password: <%= ENV.fetch("POSTGRES_PASSWORD", "") %>
    host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  cache:
    adapter: sqlite3
    database: storage/development_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    adapter: sqlite3
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    adapter: sqlite3
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB_TEST", "padmakara_find_test") %>
    username: <%= ENV.fetch("POSTGRES_USER", "") %>
    password: <%= ENV.fetch("POSTGRES_PASSWORD", "") %>
    host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  cache:
    adapter: sqlite3
    database: storage/test_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    adapter: sqlite3
    database: storage/test_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    adapter: sqlite3
    database: storage/test_cable.sqlite3
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    adapter: sqlite3
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    adapter: sqlite3
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
